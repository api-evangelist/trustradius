description: >-
  TrustRadius publishes no first-party client library for its REST API in any public package registry.
  The provider's own documentation tells integrators to call the API directly over HTTPS with an
  `x-api-key` header and points at Postman as the suggested testing tool, rather than at an SDK.
  The only distribution TrustRadius ships to a browser is the TrustQuotes for Web JavaScript snippet,
  which is generated per-widget inside the Vendor Portal and is captured in `components/` rather than
  here, because it has no registry entry and no addressable version.
