vocabulary:
  name: TrustRadius Vocabulary
  description: >-
    Domain vocabulary and terminology for TrustRadius APIs and the B2B buyer
    intelligence platform, covering reviews, scores, categories, intent data, and
    buyer research concepts.
  version: "1.1.0"
  created: "2026-05-03"
  modified: "2026-08-14"
  generated: "2026-08-14"
  method: derived
  source: >-
    openapi/_original/trustradius-api-openapi.yml (provider-published OpenAPI 3.0.0 v1.1),
    https://apidocs.trustradius.com/docs/public-api/ZG9jOjQ1Mg-trust-radius-api,
    https://apidocs.trustradius.com/docs/public-api/ZG9jOjMzODE1NA-faq,
    https://solutions.trustradius.com/pricing/
  note: >-
    Revised 2026-08-14 against the real provider-published contract. Four terms had been written
    against a scaffold specification and asserted field names, ranges and header casing the
    TrustRadius API does not use; they are corrected below and API-surface terms have been added.

terms:
  - term: TrustRadius Score (trScore)
    definition: >-
      TrustRadius's weighted product quality score, returned by GET /product-scores as an object
      `trScore: {score, max}` rather than a bare number. Read `score` relative to the `max` the API
      returns with it — the contract does not fix the range, so do not hard-code one. It sits
      alongside a separate `starScore: {score, max}`.
    surfaced_by: product_scores
    tags:
      - Ratings
      - B2B Software Reviews

  - term: Verified Review
    definition: >-
      A software review that TrustRadius has confirmed came from an actual user of the
      product, typically through LinkedIn authentication or employer verification.
      Verified reviews are marked with a verification badge.
    tags:
      - Reviews
      - Trust

  - term: Product Slug
    definition: >-
      A URL-safe identifier for a software product on TrustRadius, visible in www.trustradius.com
      product URLs. It is the HUMAN key, not the API key: no TrustRadius endpoint accepts a slug
      except GET /product-ids, whose whole job is to exchange a slug for the opaque `_id` that every
      other endpoint requires.
    surfaced_by: product_ids_get
    tags:
      - Products

  - term: Category Slug
    definition: >-
      A URL-safe identifier for a software category on the TrustRadius website. It is a website
      concept only — the published API exposes no category endpoint and accepts no category
      parameter. Category context reaches the API solely as the aggregate denominators
      (totalCategoryPageViews / totalCategoryVisits / totalCategoryVisitors) on traffic report rows.
    tags:
      - Categories

  - term: Downstream Intent Data
    definition: >-
      Second-party intent signals generated from buyer behavior on the TrustRadius
      platform, including which accounts are viewing product profiles, comparing
      competitors, and reading reviews. Distinct from third-party intent data because
      the signal originates directly from TrustRadius user activity.
    tags:
      - Intent Data
      - Buyer Intelligence

  - term: Likelihood to Recommend
    definition: >-
      A rating dimension in TrustRadius reviews asking reviewers how likely they are
      to recommend the product to others, scored on a 1-10 scale. One of the most
      commonly cited dimensions in B2B buying decisions.
    tags:
      - Reviews
      - Ratings

  - term: Content Licensing
    definition: >-
      TrustRadius's TrustQuotes program that allows vendors to license and syndicate
      verified review content — quotes, ratings, and badges — for use in digital
      advertising, landing pages, and sales materials.
    tags:
      - Content Licensing
      - Marketing

  - term: Buyer Intelligence Platform
    definition: >-
      TrustRadius's core platform that aggregates verified in-depth reviews and intent
      signals to help B2B technology buyers make purchasing decisions and help vendors
      understand who is researching their products.
    tags:
      - Buyer Intelligence
      - Platform

  - term: Company Size
    definition: >-
      A reviewer attribute in TrustRadius indicating the size of the reviewer's company:
      small (1-50 employees), medium (51-500), large (501-5000), or enterprise (5000+).
      Used to filter reviews for peer-relevant comparisons.
    tags:
      - Reviews

  - term: Pros and Cons
    definition: >-
      Structured review sections in TrustRadius reviews where reviewers list the top
      advantages (pros) and disadvantages (cons) of the product. These structured
      fields support comparison and summarization use cases.
    tags:
      - Reviews

  - term: API Key
    definition: >-
      The single opaque authentication credential for the TrustRadius REST API, obtained from the
      Vendor Portal under Integrations > "Get API key", or from a TrustRadius Client Success Manager.
      Passed in the LOWERCASE `x-api-key` HTTP header on every request. There are no scopes, no
      OAuth, and no token exchange; entitlement to individual endpoints follows the vendor package,
      not the key.
    tags:
      - Authentication

  - term: Intent-Driven Leads
    definition: >-
      A TrustRadius product that delivers ICP-qualified prospects who are actively
      researching the vendor's category on TrustRadius, delivered as opted-in leads
      with verified business email addresses.
    tags:
      - Intent Data
      - Lead Generation

  - term: TrustQuote
    definition: >-
      A licensed excerpt from a published TrustRadius review, returned by GET /trustquotes. Carries
      the quote `text`, a link back to the source review (`review.url`) and its rating, the reviewer
      and their firmographics (`user`), an `isAnonymous` flag that must be honored before rendering
      any reviewer identity, and the tag ids/names used to place it.
    surfaced_by: trustquotes_get
    tags:
      - Content Licensing
      - Reviews

  - term: TrustQuotes for Web (TQW)
    definition: >-
      The self-serve embeddable widget a vendor builds in the Vendor Portal and installs as a
      JavaScript snippet. It renders review quotes with automatic styling and star ratings, one
      product per widget. The provider frames TQW and the TrustQuotes API as a choose-one decision:
      the widget when you want rendering handled, the API when you need multiple products or your
      own storage and design. GET /reports/syndication/tqw/pages reports widget performance.
    tags:
      - Content Licensing
      - Marketing

  - term: Tag Group
    definition: >-
      The container a TrustQuotes tag belongs to, carrying `id`, `name`, `type`, `sequence` and
      `scope`. `sequence` is the vendor's display order and `scope` distinguishes vendor-scoped tags
      from global ones. Retrieved with GET /tags.
    surfaced_by: tags_get
    tags:
      - Content Licensing

  - term: Visitor Insights
    definition: >-
      Identified-company reporting on who is viewing a vendor's TrustRadius profile — firmographics
      (name, SIC code, size, location, web and social handles) with visit counts, available at
      company level and page level. Enabled per product; GET /product-ids returns
      `isVisitorInsightsEnabled` so a client can check before calling. TrustRadius tags these
      operations "Legacy" in its own specification without marking them deprecated or naming a
      replacement.
    surfaced_by: [visitor_insights_report, visitor_insights_report_pages_get, account_details]
    tags:
      - Buyer Intelligence
      - Intent Data

  - term: Intent Activity Type
    definition: >-
      The closed set of buyer behaviours the intent stream reports — `click`, `download`, `like`,
      `view`. This is the only enumerated business domain in the published API, and it is what an
      agent or routing rule should branch on. Each activity also carries a `human_readable` display
      string and the `objects` it happened to.
    surfaced_by: intent_data
    tags:
      - Intent Data

  - term: Customer Voice Package
    definition: >-
      The packaged TrustRadius vendor subscription, listed at $30k per product per year with a
      multi-year discount available. Covers review sourcing and campaigns, embedded lead capture
      with CRM integration, the content license, QuoteFinder, competitive reporting and a dedicated
      CSM. API access is issued as part of it; category intent data, premium content, enterprise SSO
      and event support are separately-quoted add-ons.
    tags:
      - Pricing
      - Buyer Intelligence
