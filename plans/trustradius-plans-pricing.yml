provider: TrustRadius
providerId: trustradius
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Reviews
  - B2B Software
  - Marketing
description: TrustRadius is a B2B software review platform that sells vendor subscriptions through direct
  sales rather than a self-serve pricing page. Buyer-side review reading is free; vendor-side packages
  (TrustQuotes, downstream syndication, lead programs, awards) are quoted per engagement. No public price
  list is available to reconcile.
sources:
  - https://www.trustradius.com/
notes: Vendor pricing is gated behind sales (the public vendor pricing endpoint returned 403). API access
  is provided to vendors as part of contracted packages; no public developer plan exists. Trimmed to a
  single Contact Sales engagement.
plans:
  - id: trustradius-contact-sales
    name: Contact Sales
    type: enterprise
    description: Custom-quoted vendor packages covering review collection, syndication, intent data, and
      API access. Pricing is not publicly disclosed.
    entries:
      - label: Vendor Subscription
        name: vendor_subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Direct Sales Engagement
      - name: Custom Vendor Package
