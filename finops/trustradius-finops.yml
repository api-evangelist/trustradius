description: >-
  TrustRadius sells vendor packages through direct sales but does publish one figure — the Customer
  Voice Package at $30k per product per year, with a multi-year discount available. The billable
  unit is therefore the PRODUCT, not the seat and not API usage: a vendor with four listed products
  carries four subscription lines. Add-ons (category intent data, premium content, enterprise SSO,
  event support, intent-driven leads) are separately quoted with no published price. There is no
  metered usage API and no FOCUS-aligned usage export; API access is an entitlement inside the
  package rather than a billed meter, and the published 10 req/s limit is a throttle, not a charge.
