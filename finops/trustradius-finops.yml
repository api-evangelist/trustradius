principles:
  - name: Visibility
    description: >-
      Visibility is limited to the contracted subscription invoice. TrustRadius exposes no usage API,
      no FOCUS export, and no consumption reporting of any kind — a customer cannot see how much of
      what they bought they are actually using, and the API returns no rate-limit headers to infer it
      from.
  - name: Allocation
    description: Allocate the vendor subscription to the marketing or product-marketing budget that owns
      the listing and review program.
  - name: Optimization
    description: >-
      Optimization happens at renewal, and the per-product unit is the lever: review which listed
      products actually earn their $30k line against attributable pipeline, and whether separately
      quoted add-ons (intent data, premium content) are being consumed. Multi-year commitment is the
      published discount path.
  - name: Accountability
    description: A marketing or CMO-organization owner manages the TrustRadius relationship and renewal;
      finance approves the annual contract.
