principles:
  - name: Visibility
    description: Visibility is limited to the contracted subscription invoice; TrustRadius does not expose
      a usage API or FOCUS export for self-service consumption.
  - name: Allocation
    description: Allocate the vendor subscription to the marketing or product-marketing budget that owns
      the listing and review program.
  - name: Optimization
    description: Optimization happens at renewal — review the package mix (reviews, syndication, intent
      data, awards) against attributable pipeline before resigning.
  - name: Accountability
    description: A marketing or CMO-organization owner manages the TrustRadius relationship and renewal;
      finance approves the annual contract.
