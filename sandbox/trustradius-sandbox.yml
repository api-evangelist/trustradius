description: >-
  TrustRadius publishes no sandbox, no test keys and no test-mode of its own. What does exist is a
  live Prism mock server that its Stoplight-hosted developer portal provisions automatically from
  the published OpenAPI. It is publicly reachable and returns schema-shaped example payloads, which
  makes the API explorable before a vendor contract is signed — but it is a documentation artifact,
  not a TrustRadius environment, and it returns synthetic values, never real review or intent data.
