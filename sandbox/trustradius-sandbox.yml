    scheme: x-api-key header
    note: >-
      Prism enforces the spec's security requirement, so a request with no `x-api-key` header
      returns 401 with a Prism UNAUTHORIZED body. Any non-empty header value satisfies it — the mock
      does not validate the key against TrustRadius, and no TrustRadius credential is involved.
  verification:
