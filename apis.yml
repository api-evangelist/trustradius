- aid: trustradius:trustradius-legacy-visitor-insights-api
  name: TrustRadius Legacy Visitor Insights API
  description: >-
    Identified-company reporting, tagged `Legacy` by TrustRadius in its own specification. GET
    /reports/visitor-insights/companies returns firmographics (name, SIC code, size, location, web and social handles)
    with visit counts; GET /reports/visitor-insights/pages adds page-level detail; GET /accounts/{account_id} drills
    into one company with its visitors and visits. Enabled per product — check isVisitorInsightsEnabled on the
    /product-ids response first. None of the three is marked deprecated and no replacement or Sunset date is
    published, so the Legacy label is a signal a machine cannot act on.
  humanURL: https://apidocs.trustradius.com/docs/public-api/YXBpOjUxMzgzNjA-trust-radius-api
