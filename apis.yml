- aid: trustradius:trustradius-trustquotes-api
  name: TrustRadius TrustQuotes Content Syndication API
  description: >-
    Licensed review-quote syndication. GET /trustquotes returns review excerpts with the quote text, a link and rating
    for the source review, reviewer identity and firmographics, an isAnonymous flag, and the tags applied to the
    quote; GET /tags returns the tag vocabulary and its groups; GET /reports/syndication/tqw/pages reports how the
    TrustQuotes for Web widget is performing by page. Requires a Content Licensing entitlement. The self-serve
    TrustQuotes for Web JavaScript widget is the no-code alternative to this API.
  humanURL: https://solutions.trustradius.com/products/content-licensing/
