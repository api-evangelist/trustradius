- aid: trustradius:trustradius-traffic-data-api
  name: TrustRadius Traffic Data API
  description: >-
    Profile traffic reporting. GET /reports/traffic/products returns page views, visits and visitors per product per
    day alongside the matching category-level totals, so share-of-category is computable client-side. GET
    /reports/traffic/pages breaks the same window down by page type, page title and URL. Both accept ISO 8601
    start-date/end-date filters, comma-separated product ids, skip/limit paging, and a format parameter for JSON or CSV.
  humanURL: https://apidocs.trustradius.com/docs/public-api/YXBpOjUxMzgzNjA-trust-radius-api
  baseURL: https://api.trustradius.com/v1
