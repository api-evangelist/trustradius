- aid: trustradius:trustradius-intent-data-api
  name: TrustRadius Downstream Intent Data API
  description: >-
    Downstream intent activity — which accounts are researching a vendor's products, competitor products, and software
    categories on TrustRadius. GET /intent returns account records with an activity stream whose `type` is a closed
    enum of click, download, like and view, filtered by ISO 8601 `start_time`/`stop_time`, account domains, and
    activity names. Designed for activation in Salesforce, HubSpot, 6sense, Demandbase, Marketo, LinkedIn Matched
    Audiences and Snowflake. Category intent data is a separately quoted add-on to the vendor package.
  humanURL: https://solutions.trustradius.com/products/downstream-intent-data/
