apis:
- aid: trustradius:trustradius-product-data-api
  name: TrustRadius Product Data API
  description: >-
    Product identity and scoring. GET /product-ids exchanges a TrustRadius product slug for the opaque product `_id`
    and owning `vendor._id` that every other TrustRadius operation requires, and called with no parameters returns
    every published product under the calling vendor's profile. GET /product-scores returns the TrustRadius (TR)
    Score and star score — each as a {score, max} object — plus review, rating and combined counts. This is the
    entry point for the whole API.
  humanURL: https://apidocs.trustradius.com/docs/public-api/YXBpOjUxMzgzNjA-trust-radius-api
  baseURL: https://api.trustradius.com/v1
