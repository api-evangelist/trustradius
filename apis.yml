name: TrustRadius
description: >-
  TrustRadius is a B2B buyer intelligence and software review platform that helps technology buyers make confident
  purchasing decisions and enables vendors to turn verified customer reviews into demand generation. Founded in 2012 and
  headquartered in Austin, Texas, and now part of HG Insights, TrustRadius hosts in-depth verified reviews averaging
  400+ words, and provides vendors with downstream intent data showing which accounts are actively researching their
  products, competitors, and categories. The TrustRadius Public API is a single read-only REST surface at
  https://api.trustradius.com/v1 with eleven GET operations across five areas — product identity and scores, downstream
  intent activity, profile traffic reporting, licensed TrustQuotes review excerpts, and a legacy visitor-insights
  family. Authentication is one opaque API key in the lowercase x-api-key header, issued per vendor account from the
  Vendor Portal; the published request budget is 10 requests per second. Intent data is designed to be activated in
  Salesforce, HubSpot, 6sense, Demandbase, LinkedIn, Marketo, and Snowflake.
